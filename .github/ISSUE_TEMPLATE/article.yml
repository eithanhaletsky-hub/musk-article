name: כתבה חדשה
description: שליחת כתבה לפרסום ב-EasyPublish
title: "כתבה: "
labels: ["כתבה חדשה"]
body:
  - type: markdown
    attributes:
      value: |
        תודה שאתם כותבים ל-EasyPublish! אחרי שתלחצו **Create**, המערכת תקרא את הכתבה, ואם היא תאושר היא תעלה לאתר אוטומטית.
  - type: input
    id: headline
    attributes:
      label: כותרת
    validations:
      required: true
  - type: input
    id: dek
    attributes:
      label: כותרת משנה
  - type: input
    id: author
    attributes:
      label: שם הכותב/ת
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: מדור
      description: "טכנולוגיה / עסקים / חלל / פרופילים / כללי"
      value: כללי
  - type: textarea
    id: content
    attributes:
      label: הכתבה עצמה
      description: "שורה ריקה = פסקה חדשה · ## = כותרת ביניים · > = ציטוט מודגש"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: מקורות
      description: קישור אחד בכל שורה (לא חובה)
  - type: checkboxes
    id: terms
    attributes:
      label: אישור
      options:
        - label: הכתבה מקורית, נכתבה על ידי, ואני מסכים/ה שתתפרסם באתר
          required: true
